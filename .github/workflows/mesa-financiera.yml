name: mesa-financiera

on:
  schedule:
    - cron: "*/6 * * * *"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker a analizar"
        required: false
        default: "AAPL"
      simulacion:
        description: "Modo simulación"
        type: boolean
        default: false

concurrency:
  group: mesa-financiera
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENAI_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      MODO_SIMULACION: ${{ inputs.simulacion && '1' || '0' }}
      TICKER: ${{ inputs.ticker }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Analizar el ticker indicado
        if: github.event_name == 'workflow_dispatch' && env.TICKER != ''
        run: python analizar.py "$TICKER" --telegram
      - name: Revisar mensajes pendientes
        run: python revisar_telegram.py
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-${{ github.run_number }}
          path: salidas/
          if-no-files-found: ignore
          retention-days: 14
